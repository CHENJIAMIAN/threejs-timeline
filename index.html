<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="description" content="可配置年份范围的 Three.js TSL 立体时间轴，支持 WebGPU / WebGL2。" />
<title>立体时间轴 · Three.js TSL</title>
<!-- 内联 SVG favicon：顺手干掉浏览器自动请求 favicon.ico 造成的 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%233ad9ff'/%3E%3Cstop offset='.55' stop-color='%23a05cff'/%3E%3Cstop offset='1' stop-color='%23ff5ec8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230b0a18'/%3E%3Crect x='11' y='34' width='7' height='18' rx='3' fill='url(%23g)'/%3E%3Crect x='23' y='24' width='7' height='28' rx='3' fill='url(%23g)'/%3E%3Crect x='35' y='16' width='7' height='36' rx='3' fill='url(%23g)'/%3E%3Crect x='47' y='10' width='7' height='42' rx='3' fill='url(%23g)'/%3E%3C/svg%3E" />
<style>
  :root{
    --glass-bg: rgba(18, 16, 38, 0.42);
    --glass-bd: rgba(160, 180, 255, 0.18);
    --txt: #e9ecff;
    --txt-dim: #9aa3c7;
    --accent: #5ee7ff;
    --accent2: #ff5ec8;
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; margin:0; background:#04030c; overflow:hidden; }
  body{
    font-family: "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color: var(--txt);
    -webkit-font-smoothing: antialiased;
  }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* ---------- 毛玻璃 UI ---------- */
  .glass{
    background: var(--glass-bg);
    border: 1px solid var(--glass-bd);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 8px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .panel{ position:absolute; padding:14px 16px; pointer-events:auto; user-select:none; }

  #head{ top:22px; left:300px; max-width:min(42vw,520px); }
  #head h1{
    margin:0 0 6px; font-size:26px; font-weight:700; letter-spacing:.06em;
    background:linear-gradient(92deg,#7af0ff 0%,#a78bfa 42%,#ff7ad9 78%,#ffb06a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #head p{ margin:0; font-size:12.5px; line-height:1.6; color:var(--txt-dim); }
  #head code{
    font-family: ui-monospace, Consolas, monospace; font-size:11.5px;
    background:rgba(120,140,255,.14); border:1px solid rgba(140,160,255,.22);
    padding:1px 6px; border-radius:6px; color:#bcd0ff;
  }

  #hud{ top:22px; left:24px; width:252px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .row:last-child{ margin-bottom:0; }
  .k{ font-size:11.5px; color:var(--txt-dim); letter-spacing:.04em; }
  .v{ font-size:11.5px; font-variant-numeric:tabular-nums; color:#cfe0ff; }
  .tag{
    font-size:10.5px; padding:2px 8px; border-radius:999px; letter-spacing:.06em;
    border:1px solid rgba(94,231,255,.35); background:rgba(94,231,255,.12); color:#9df1ff;
  }
  .tag.warn{ border-color:rgba(255,176,106,.4); background:rgba(255,176,106,.12); color:#ffd0a0; }
  hr.sep{ border:0; border-top:1px solid rgba(150,170,255,.14); margin:11px 0; }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:124px; height:3px; border-radius:3px;
    background:linear-gradient(90deg,#5ee7ff,#a78bfa,#ff5ec8); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#eaf2ff; border:2px solid rgba(120,150,255,.7); cursor:pointer;
    box-shadow:0 0 10px rgba(120,180,255,.8);
  }
  .btns{ display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
  button{
    font:inherit; font-size:11.5px; color:#dbe4ff; cursor:pointer;
    padding:6px 11px; border-radius:10px; letter-spacing:.03em;
    background:rgba(120,140,255,.13); border:1px solid rgba(150,170,255,.24);
    transition:.18s;
  }
  button:hover{ background:rgba(140,170,255,.26); border-color:rgba(160,190,255,.5); }
  button.on{ background:rgba(94,231,255,.22); border-color:rgba(94,231,255,.6); color:#d6fbff; box-shadow:0 0 16px rgba(94,231,255,.28); }

  #legend{ bottom:24px; left:24px; padding:12px 14px; }
  #legend .bar{
    width:226px; height:8px; border-radius:6px;
    background:linear-gradient(90deg,#3ad9ff,#4a7bff,#a05cff,#ff5ec8,#ff9a52);
    box-shadow:0 0 22px rgba(150,120,255,.55);
  }
  #legend .lb{ display:flex; justify-content:space-between; margin-top:7px; font-size:11px; color:var(--txt-dim); }

  .row.bench{ display:none; }
  body.bench .row.bench{ display:flex; }
  #tip{
    position:absolute; left:0; top:0; pointer-events:none; padding:9px 12px; opacity:0;
    transform:translate(-50%,-118%); transition:opacity .16s; white-space:nowrap; z-index:9;
  }
  #tip .y{ font-size:17px; font-weight:700; letter-spacing:.04em; }
  #tip .t{ font-size:11.5px; color:#c8d3ff; margin-top:3px; }
  #tip .m{ font-size:10.5px; color:var(--txt-dim); margin-top:2px; font-variant-numeric:tabular-nums; }
  #tip .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }

  #boot{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; background:#04030c;
    transition:opacity .7s; text-align:center; padding:24px;
  }
  #boot .sp{
    width:34px; height:34px; border-radius:50%;
    border:2px solid rgba(120,150,255,.22); border-top-color:#5ee7ff;
    animation:spin .85s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #boot .msg{ font-size:12.5px; color:var(--txt-dim); letter-spacing:.08em; }
  #boot.err .sp{ display:none; }
  #boot.err .msg{ color:#ff9a9a; max-width:640px; line-height:1.8; }
  #boot.hide{ opacity:0; pointer-events:none; }
  @media (max-width:1100px){
    #head{ left:24px; top:auto; bottom:96px; }
  }
  @media (max-width:820px){
    #hud{ display:none; }
    #legend{ transform:scale(.85); transform-origin:left bottom; }
    #head h1{ font-size:19px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="head" class="panel glass">
  <h1 id="app-title">立体时间轴</h1>
  <p>
    Three.js <code>r186</code> · <code>WebGPURenderer</code> · 全部效果由 <code>TSL</code> 节点编写<br />
    雾 + 毛玻璃立柱 + 体积光晕 + 极光天幕 ｜ 拖拽旋转 · 滚轮缩放 · 悬停查看年份<br />全场景实例化（5 个 InstancedMesh）· 自适应分辨率 · <code>?start=2000&amp;end=2024</code> 可改范围
  </p>
</div>

<div id="hud" class="panel glass">
  <div class="row"><span class="k">渲染后端</span><span class="tag" id="s-backend">初始化中…</span></div>
  <div class="row"><span class="k">帧率</span><span class="v" id="s-fps">-- fps</span></div>
  <div class="row"><span class="k">渲染倍率</span><span class="v" id="s-dpr">--</span></div>
  <div class="row"><span class="k">立柱 / 年份</span><span class="v" id="s-count">--</span></div>
  <div class="row bench"><span class="k">GPU 帧时间</span><span class="v" id="s-gpu">--</span></div>
  <div class="row bench"><span class="k">CPU 提交</span><span class="v" id="s-cpu">--</span></div>
  <div class="row bench"><span class="k">Draw call</span><span class="v" id="s-calls">--</span></div>
  <div class="row bench"><span class="k">着色器程序</span><span class="v" id="s-progs">--</span></div>
  <div class="row bench"><span class="k">三角面</span><span class="v" id="s-tris">--</span></div>
  <hr class="sep" />
  <div class="row"><span class="k">雾浓度</span><input id="p-fog" type="range" min="0" max="200" value="100" /></div>
  <div class="row"><span class="k">曝光</span><input id="p-exp" type="range" min="40" max="220" value="100" /></div>
  <div class="row"><span class="k">毛玻璃粗糙度</span><input id="p-rough" type="range" min="0" max="200" value="100" /></div>
  <hr class="sep" />
  <div class="btns">
    <button id="b-rot" class="on">自动旋转</button>
    <button id="b-cruise">巡游</button>
    <button id="b-labels" class="on">年份牌</button>
    <button id="b-quality">画质：自动</button>
    <button id="b-reset">重置视角</button>
  </div>
</div>

<div id="legend" class="panel glass">
  <div class="bar"></div>
  <div class="lb"><span id="legend-start">起始</span><span id="legend-mid">中间</span><span id="legend-end">结束</span></div>
</div>

<div id="tip" class="glass">
  <div class="y"><span class="dot"></span><span id="tip-year"></span></div>
  <div class="t" id="tip-tag"></div>
  <div class="m" id="tip-meta"></div>
</div>

<div id="boot">
  <div class="sp"></div>
  <div class="msg" id="boot-msg">正在初始化 WebGPU / TSL 渲染管线…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.webgpu.js",
    "three/webgpu": "./node_modules/three/build/three.webgpu.js",
    "three/tsl": "./node_modules/three/build/three.tsl.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
